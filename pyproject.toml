[project]
name = "toolloop-cli"
version = "0.1.0"
description = "A hand-written tool-using CLI chat assistant over the Anthropic Messages API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.8.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "toolloop"

[project.scripts]
toolloop = "toolloop.cli:main"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
